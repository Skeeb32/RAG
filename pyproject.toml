[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent-portfolio"
version = "0.1.0"
description = "An inspectable LangGraph RAG agent with reproducible evaluations"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langgraph>=1.0,<2", "rank-bm25==0.2.2", "numpy>=1.26,<3",
  "sentence-transformers>=5,<6", "httpx>=0.27,<1", "pydantic>=2.9,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
rag-agent = "rag_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
